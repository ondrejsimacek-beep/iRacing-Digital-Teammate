name: Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build launcher
        shell: powershell
        run: |
          $version = (Get-Content -LiteralPath '.\version.txt' -Raw).Trim()
          $expectedTag = "v$version"
          if ($expectedTag -ne "${{ github.ref_name }}") {
            throw "Release tag ${{ github.ref_name }} does not match version.txt ($expectedTag)."
          }
          .\build.ps1 -Release -UpdateRepository "${{ github.repository }}"

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: powershell
        run: .\build-installer.ps1

      - name: Package release
        shell: powershell
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = ".\dist\iRacing-Digital-Teammate-$tag-portable.zip"
          $setup = ".\dist\iRacing-Digital-Teammate-Setup-$tag.exe"
          Compress-Archive -LiteralPath '.\dist\iRacing Digital Teammate.exe', '.\dist\README.md' -DestinationPath $zip -Force
          foreach ($asset in @($setup, $zip)) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $asset).Hash.ToLowerInvariant()
            $name = Split-Path -Leaf $asset
            "$hash  $name" | Set-Content -LiteralPath ($asset + '.sha256') -Encoding ascii
          }

      - name: Publish GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create $tag ".\dist\iRacing-Digital-Teammate-Setup-$tag.exe" ".\dist\iRacing-Digital-Teammate-Setup-$tag.exe.sha256" ".\dist\iRacing-Digital-Teammate-$tag-portable.zip" ".\dist\iRacing-Digital-Teammate-$tag-portable.zip.sha256" --generate-notes --title "iRacing Digital Teammate $tag"
